name: Deploy BE (VehicleRental)

on:
  push:
    branches:
      - feat/praktikum-9

env:
  DOCKER_IMAGE_NAME: ${{ secrets.TI_BE_DOCKER_IMAGE }}
  EC2_HOST: ${{ secrets.EC2_HOST }}
  EC2_USER: ${{ secrets.EC2_USER }}

jobs:
  # ============================
  # BUILD JOB
  # ============================
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Build JAR
        run: |
          echo "systemProp.org.gradle.internal.http.connectionTimeout=60000" >> gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=60000" >> gradle.properties
          chmod +x ./gradlew
          ./gradlew clean build -x test --no-daemon
          cp $(ls build/libs/*SNAPSHOT.jar | grep -v plain | head -n 1) app.jar

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: be-artifacts
          path: |
            app.jar
            Dockerfile
            k8s/

  # ============================
  # DOCKER BUILD + PUSH
  # ============================
  docker-push:
    runs-on: ubuntu-latest
    needs: build

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: be-artifacts

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${IMAGE_TAG} .

      - name: Push Docker Image
        run: docker push $DOCKER_IMAGE_NAME:${IMAGE_TAG}

  # ============================
  # DEPLOY KE EC2 + K3s
  # ============================
  deploy:
    runs-on: ubuntu-latest
    needs: docker-push

    env:
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: be-artifacts

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts

      # -------- Generate ConfigMap
      - name: Generate ConfigMap
        run: |
          cat <<EOF > configmap.yaml
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: vehiclerental-be-config
            namespace: default
          data:
            DATABASE_URL_PROD: "${{ secrets.TI_BE_DATABASE_URL }}"
            DATABASE_USERNAME: "${{ secrets.TI_BE_DATABASE_USER }}"
          EOF

      # -------- Generate Secret
      - name: Generate Secret
        run: |
          cat <<EOF > secret.yaml
          apiVersion: v1
          kind: Secret
          metadata:
            name: vehiclerental-be-secret
            namespace: default
          type: Opaque
          stringData:
            DATABASE_PASSWORD: "${{ secrets.TI_BE_DATABASE_PASS }}"
            CORS_ALLOWED_ORIGINS: "${{ secrets.TI_CORS_ORIGINS }}"
          EOF

      # -------- Replace image tag in deployment.yaml
      - name: Replace image tag
        run: sed "s|REPLACE_ME_TAG|${IMAGE_TAG}|g" k8s/deployment.yaml > deployment.yaml

      # -------- Upload to EC2
      - name: Upload manifests to EC2
        run: |
          ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/vehiclerental-be/k8s"
          scp deployment.yaml configmap.yaml secret.yaml \
              k8s/service.yaml k8s/ingress.yaml \
              $EC2_USER@$EC2_HOST:~/app/vehiclerental-be/k8s/

      # -------- Apply to K3s
      - name: Apply to K3s Cluster
        run: |
          ssh $EC2_USER@$EC2_HOST "
            sudo k3s kubectl apply -f ~/app/vehiclerental-be/k8s/ &&
            sudo k3s kubectl rollout restart deployment/vehiclerental-be -n default &&
            sudo k3s kubectl rollout status deployment/vehiclerental-be -n default
          "
