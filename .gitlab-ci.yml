stages:
  - build
  - docker-push
  - deploy

variables:
  DOCKER_IMAGE_NAME: $TI_BE_DOCKER_IMAGE
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: eclipse-temurin:21-jdk
  script:
    - chmod +x ./gradlew
    - ./gradlew clean build -x test
    - cp $(find build/libs -name "*.jar" | head -n 1) app.jar
  artifacts:
    paths:
      - app.jar
      - Dockerfile
      - k8s/ # Mengambil semua file dari folder k8s
    expire_in: 1 hour
  only:
    # Mentrigger pipeline HANYA untuk branch TI
    - feat/praktikum-9

docker-push:
  stage: docker-push
  image: docker:24
  services:
    - name: docker:24-dind
      command: ["--insecure-registry", "registry-1.docker.io"]
  dependencies:
    - build
  before_script:
    # Login ke Docker Hub menggunakan variabel dari GitLab
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t $DOCKER_IMAGE_NAME:$IMAGE_TAG .
    - docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
  only:
    # Mentrigger pipeline HANYA untuk branch TI
    - feat/praktikum-9

deploy:
  stage: deploy
  image: alpine:latest
  dependencies:
    - docker-push # Seharusnya 'docker-push', bukan 'build', agar tag image-nya benar
  before_script:
    - apk add --no-cache openssh bash
    - mkdir -p ~/.ssh
    - echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - echo "Generating Kubernetes ConfigMap & Secret via printf..."
    # Membuat ConfigMap untuk TI BE
    - |
      printf "apiVersion: v1\nkind: ConfigMap\nmetadata:\n  name: vehiclerental-be-config\n  namespace: default\ndata:\n  DATABASE_URL_PROD: \"%s\"\n  DATABASE_USERNAME: \"%s\"\n" \
      "$TI_BE_DATABASE_URL" "$TI_BE_DATABASE_USER" > configmap.yaml

    - |
      printf "apiVersion: v1\nkind: Secret\nmetadata:\n  name: vehiclerental-be-secret\n  namespace: default\ntype: Opaque\nstringData:\n  DATABASE_PASSWORD: \"%s\"\n  CORS_ALLOWED_ORIGINS: \"%s\"\n" \
      "$TI_BE_DATABASE_PASS" "$TI_CORS_ORIGINS" > secret.yaml
    - sed "s|REPLACE_ME_TAG|$IMAGE_TAG|g" k8s/deployment.yaml > deployment.yaml
    - echo "Creating -> deployment.yaml, configmap.yaml, secret.yaml, service.yaml, ingress.yaml"

    # Membuat direktori di server EC2 (menggunakan nama app TI)
    - ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app/vehiclerental-be/k8s"

    # Mengirim semua file k8s yang sudah disiapkan ke server
    - scp deployment.yaml configmap.yaml secret.yaml k8s/service.yaml k8s/ingress.yaml $EC2_USER@$EC2_HOST:~/app/vehiclerental-be/k8s/

    # Menjalankan 'kubectl apply' di server
    - |
      ssh $EC2_USER@$EC2_HOST "
        sudo k3s kubectl apply -f ~/app/vehiclerental-be/k8s/ &&
        sudo k3s kubectl rollout status deployment/vehiclerental-be -n default
      "
  only:
    # Mentrigger pipeline HANYA untuk branch TI
    - feat/praktikum-9
